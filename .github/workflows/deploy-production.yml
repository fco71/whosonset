name: Deploy to Firebase Hosting (production)

# Triggers:
# - Auto-deploy whenever code is pushed to main
# - Manual trigger from the GitHub Actions tab via "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Prevent two deploys running at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build and deploy to myfilmjobs.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
      REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
      REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
      REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
      REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
      REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
      REACT_APP_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.REACT_APP_FIREBASE_APP_CHECK_SITE_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Firebase web config
        run: |
          missing=0
          for key in \
            REACT_APP_FIREBASE_API_KEY \
            REACT_APP_FIREBASE_AUTH_DOMAIN \
            REACT_APP_FIREBASE_PROJECT_ID \
            REACT_APP_FIREBASE_STORAGE_BUCKET \
            REACT_APP_FIREBASE_MESSAGING_SENDER_ID \
            REACT_APP_FIREBASE_APP_ID \
            REACT_APP_FIREBASE_APP_CHECK_SITE_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured in GitHub Actions secrets"
              missing=1
            fi
          done
          exit "$missing"

      - name: Write CI env file
        run: |
          {
            echo "REACT_APP_FIREBASE_API_KEY=${REACT_APP_FIREBASE_API_KEY}"
            echo "REACT_APP_FIREBASE_AUTH_DOMAIN=${REACT_APP_FIREBASE_AUTH_DOMAIN}"
            echo "REACT_APP_FIREBASE_PROJECT_ID=${REACT_APP_FIREBASE_PROJECT_ID}"
            echo "REACT_APP_FIREBASE_STORAGE_BUCKET=${REACT_APP_FIREBASE_STORAGE_BUCKET}"
            echo "REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${REACT_APP_FIREBASE_MESSAGING_SENDER_ID}"
            echo "REACT_APP_FIREBASE_APP_ID=${REACT_APP_FIREBASE_APP_ID}"
            echo "REACT_APP_FIREBASE_MEASUREMENT_ID=${REACT_APP_FIREBASE_MEASUREMENT_ID}"
            echo "REACT_APP_FIREBASE_APP_CHECK_SITE_KEY=${REACT_APP_FIREBASE_APP_CHECK_SITE_KEY}"
          } > .env

      # Gate the deploy on the same checks run locally. The 2026-06-10 outage
      # shipped through a pipeline with no typecheck and no tests.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:run

      - name: Run Firestore rules emulator tests
        run: npm run test:rules

      - name: Build production bundle
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html missing after build"
            exit 1
          fi
          if [ ! -f dist/healthz.json ]; then
            echo "::error::dist/healthz.json missing - did copy-static-seo-assets run?"
            exit 1
          fi
          for key in \
            REACT_APP_FIREBASE_API_KEY \
            REACT_APP_FIREBASE_PROJECT_ID \
            REACT_APP_FIREBASE_APP_ID \
            REACT_APP_FIREBASE_APP_CHECK_SITE_KEY; do
            if ! grep -R -F "${!key}" dist --include='*.js' >/dev/null; then
              echo "::error::$key was not injected into the production bundle"
              exit 1
            fi
          done
          echo "Build OK. dist/ size:"
          du -sh dist/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/403346239424/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-action-whosonset@my-film-jobs.iam.gserviceaccount.com

      - name: Backfill project crew membership index
        run: node scripts/backfill-project-crew-member-ids.cjs --apply

      - name: Deploy to Firebase Hosting (production target)
        run: npx firebase deploy --only hosting:production --project my-film-jobs --non-interactive

      # Post-deploy release integrity. This step FAILS the run (the old smoke
      # test only warned, and went green during the 2026-06-10 missing-chunk
      # outage). Two guarantees:
      #   1) Live index.html references the exact main bundle just built
      #      (catches stale/mixed releases on both hostnames).
      #   2) Every JS/CSS file in dist/ is served live with a non-HTML
      #      content-type. Firebase's SPA rewrite serves index.html with
      #      HTTP 200 for MISSING files, so status alone proves nothing —
      #      an HTML content-type on a .js path means the chunk is gone.
      - name: Verify deployed release integrity
        run: |
          set -euo pipefail
          main_local=$(grep -oE 'main\.[a-f0-9]+\.js' dist/index.html | head -n1)
          if [ -z "$main_local" ]; then
            echo "::error::No main.*.js reference found in local dist/index.html"
            exit 1
          fi
          echo "Expecting live index.html to reference: $main_local"

          for host in "https://myfilmjobs-com.web.app" "https://myfilmjobs.com"; do
            ok=0
            for attempt in $(seq 1 10); do
              live=$(curl -sS "$host/index.html?cb=$(date +%s)" || true)
              if printf '%s' "$live" | grep -qF "$main_local"; then
                echo "$host is serving the new release (attempt $attempt)."
                ok=1
                break
              fi
              echo "$host not serving the new release yet (attempt $attempt/10); retrying in 10s..."
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$host never served an index.html referencing $main_local — stale or mixed release"
              exit 1
            fi
          done

          fail=0
          count=0
          while IFS= read -r f; do
            rel="${f#dist/}"
            count=$((count + 1))
            resp=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "https://myfilmjobs.com/$rel")
            code="${resp%% *}"
            ctype="${resp#* }"
            if [ "$code" != "200" ]; then
              echo "::error::/$rel returned HTTP $code"
              fail=1
            fi
            case "$ctype" in
              text/html*)
                echo "::error::/$rel was served as HTML — the file is missing from the release and the SPA rewrite masked it"
                fail=1
                ;;
            esac
          done < <(find dist -type f \( -name '*.js' -o -name '*.css' \) | sort)
          echo "Checked $count built assets against https://myfilmjobs.com"
          exit "$fail"

      - name: Smoke-test healthz
        run: |
          set -euo pipefail
          for url in \
            "https://myfilmjobs.com/healthz.json" \
            "https://myfilmjobs-com.web.app/healthz.json"; do
            echo ""
            echo "Checking $url"
            code=$(curl -s -o /tmp/body -w "%{http_code}" "$url")
            echo "  HTTP $code"
            cat /tmp/body
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code"
              exit 1
            fi
          done
