name: Deploy to Firebase Hosting (production)

# Triggers:
# - Auto-deploy whenever code is pushed to main
# - Manual trigger from the GitHub Actions tab via "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent two deploys running at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build and deploy to myfilmjobs.com
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html missing after build"
            exit 1
          fi
          if [ ! -f dist/healthz.json ]; then
            echo "::error::dist/healthz.json missing - did copy-static-seo-assets run?"
            exit 1
          fi
          echo "Build OK. dist/ size:"
          du -sh dist/

      - name: Deploy to Firebase Hosting (production target)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_FILM_JOBS }}
          projectId: my-film-jobs
          target: production
          channelId: live

      - name: Smoke-test the live site
        run: |
          echo "Waiting 10s for CDN to refresh..."
          sleep 10
          for url in \
            "https://myfilmjobs.com/healthz.json" \
            "https://myfilmjobs-com.web.app/healthz.json"; do
            echo ""
            echo "Checking $url"
            code=$(curl -s -o /tmp/body -w "%{http_code}" "$url")
            echo "  HTTP $code"
            cat /tmp/body
            if [ "$code" != "200" ]; then
              echo "::warning::$url returned HTTP $code"
            fi
          done
