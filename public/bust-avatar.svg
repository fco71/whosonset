<svg width="150" height="150" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <!-- Background circle -->
  <circle cx="75" cy="75" r="75" fill="url(#gradient)"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simple person icon - very clear and visible -->
  <!-- Head -->
  <circle cx="75" cy="60" r="20" fill="white"/>
  
  <!-- Body -->
  <rect x="65" y="80" width="20" height="25" fill="white" rx="10"/>
  
  <!-- Arms -->
  <rect x="45" y="85" width="20" height="8" fill="white" rx="4"/>
  <rect x="85" y="85" width="20" height="8" fill="white" rx="4"/>
  
  <!-- Simple face -->
  <!-- Eyes -->
  <circle cx="70" cy="55" r="2" fill="#667eea"/>
  <circle cx="80" cy="55" r="2" fill="#667eea"/>
  
  <!-- Mouth -->
  <path d="M 70 65 Q 75 68 80 65" stroke="#667eea" stroke-width="1.5" fill="none"/>
</svg> 